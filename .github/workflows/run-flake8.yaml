name: Lint code repository
on:
  workflow_call:
    inputs:
      lint-path:
        description: Path to lint files for
        required: true
        type: string

    outputs:
      lint-results:
        description: Results of flake8
        value: ${{ jobs.lint.outputs.results }}

jobs:

  lint:

    # Job config
    name: Lint code
    runs-on: small
    container:
      image: p2p/ubuntu24:latest
    permissions:
      contents: read

    # Outputs
    outputs:
      results: ${{ steps.lint.outputs.stdout }}

    # Steps
    steps:
      - name: Check out source repository
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python environment
        id: setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: flake8 Lint
        id: lint
        uses: py-actions/flake8@84ec6726560b6d5bd68f2a5bed83d62b52bb50ba # v2
        with:
          path: "${{ inputs.lint-path }}"
          args: "--config=setup.cfg"
